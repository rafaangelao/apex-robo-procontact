name: Sincronizar chamadas manuais

on:
  # Sem schedule do GitHub: quem dispara é o pg_cron do Supabase, via API com modo=real. O liga/desliga são esses jobs.
  # - robo-procontact-disparo (minuto 17, de hora em hora): rodada completa = manuais do mês inteiro + discador
  # - robo-procontact-rapido (minutos 02, 32 e 47): rapido=sim = só as manuais de hoje, sem o discador (~2 min)
  workflow_dispatch:
    inputs:
      modo:
        description: 'dry = só confere (não grava); real = grava'
        type: choice
        options: [dry, real]
        default: dry
      rapido:
        description: 'sim = só as chamadas manuais de hoje, sem o discador (rodada de 15 em 15 min)'
        type: choice
        options: [nao, sim]
        default: nao

concurrency:
  group: procontact
  cancel-in-progress: false

jobs:
  sincronizar:
    # ROBO_ATIVO só valia para o schedule do GitHub (removido); disparo manual/API sempre roda
    if: github.event_name == 'workflow_dispatch' || vars.ROBO_ATIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restaurar o cache dos arquivos estáticos do ProContact
        uses: actions/cache/restore@v4
        with:
          path: .cache-estatico
          key: procontact-estatico-${{ github.run_id }}
          restore-keys: procontact-estatico-
      - name: Diagnóstico de rede (a página de login do ProContact responde a partir do GitHub?)
        env:
          PROCONTACT_URL: ${{ secrets.PROCONTACT_URL }}
        run: |
          curl -sS -m 25 -o /dev/null -w "HTTP %{http_code} em %{time_total}s (conexão %{time_connect}s)\n" "$PROCONTACT_URL" || echo "SEM RESPOSTA em 25s (bloqueio de rede ou de IP)"
          echo "IP de saída do runner: $(curl -sS -m 10 https://api.ipify.org || echo desconhecido)"
        continue-on-error: true
      - run: node src/main.js
        env:
          PROCONTACT_TEMPO_MS: 300000
          # ontem+hoje do discador passa de 60 mil linhas (50 colunas): o SheetJS precisa de mais memória que o padrão
          NODE_OPTIONS: --max-old-space-size=4096
          MODO: ${{ github.event_name == 'workflow_dispatch' && (inputs.modo || 'dry') || 'real' }}
          FORCAR: ${{ github.event_name == 'workflow_dispatch' }}
          RAPIDO: ${{ inputs.rapido || 'nao' }}
          PROCONTACT_URL: ${{ secrets.PROCONTACT_URL }}
          PROCONTACT_USUARIO: ${{ secrets.PROCONTACT_USUARIO }}
          PROCONTACT_SENHA: ${{ secrets.PROCONTACT_SENHA }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          # Discador (REGRAS §87/§89): só roda com a variável do repositório DISCADOR_ATIVO=true; campanhas pelo começo do
          # nome (variável DISCADOR_CAMPANHAS; vazio = DISCADOR-APEX-,MIGRACAO-CLARO). Falha aqui não muda as manuais.
          DISCADOR_ATIVO: ${{ vars.DISCADOR_ATIVO }}
          DISCADOR_CAMPANHAS: ${{ vars.DISCADOR_CAMPANHAS }}
          INGEST_DISCADOR_URL: ${{ secrets.INGEST_DISCADOR_URL }}
          INGEST_DISCADOR_TOKEN: ${{ secrets.INGEST_DISCADOR_TOKEN }}
      - name: Guardar o cache dos arquivos estáticos (mesmo se o robô falhar)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache-estatico
          key: procontact-estatico-${{ github.run_id }}
